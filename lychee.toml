# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio anti-bot),
# mesmo com o perfil no ar. A Amazon responde HTTP 404 falso ao lychee (mas HTTP 200 real
# com curl usando User-Agent de navegador — verificado manualmente para os 2 livros citados
# no guia). Ambos os domínios ficam excluídos da verificação automatizada por esse motivo.
exclude = ["^https://www\\.linkedin\\.com/", "^https://www\\.amazon\\.com/"]
